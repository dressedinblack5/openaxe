name: branch-naming

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request
            const branch = pr.head.ref
            // Convention: short branch name of at most three words, separated by hyphens.
            // No feat/, fix/, etc. prefixes.
            const valid = /^[a-z][a-z0-9-]{0,30}$/.test(branch) && !branch.includes('/') && branch.split('-').length <= 3
            if (!valid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `Branch name \`${branch}\` does not follow the naming convention. Use short lowercase hyphenated names with at most 3 words (e.g., \`session-recovery\`, \`fix-scroll-state\`). No feat/fix prefixes required.`
              })
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs:branch-name']
              })
            }
